name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH v0.5.0
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nsh" --version

      - name: Add Intel Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Resolve version
        id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("nsh.json"))["version"])')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=${GITHUB_REF_NAME#v}
            if [ "$TAG" != "$VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match nsh.json version $VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          ./scripts/check-strings.py
          cargo test -p podnook-core
          nsh test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CERT_PEM: ${{ secrets.MACOS_CERT_PEM }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$CERT_PEM" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "缺少 MACOS_CERT_P12 / MACOS_CERT_PASSWORD / MACOS_CERT_PEM / MACOS_SIGN_IDENTITY secrets。" >&2
            echo "见 docs/RELEASING.md。" >&2
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/podnook-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          export KEYCHAIN KEYCHAIN_PASSWORD CERT_PASSWORD

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "signing.p12").write_bytes(
              base64.b64decode(os.environ["CERT_P12"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          OLD_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $OLD_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN"

          printf '%s\n' "$CERT_PEM" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"

          security find-identity -v -p codesigning
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          OUT_DIR: ${{ runner.temp }}/dist
        run: ./scripts/build-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Podnook-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/dist/Podnook-*.dmg
            ${{ runner.temp }}/dist/Podnook-*.dmg.sha256

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/Podnook-$VERSION-arm64.dmg" \
            "$RUNNER_TEMP/dist/Podnook-$VERSION-arm64.dmg.sha256" \
            "$RUNNER_TEMP/dist/Podnook-$VERSION-x86_64.dmg" \
            "$RUNNER_TEMP/dist/Podnook-$VERSION-x86_64.dmg.sha256" \
            --title "Podnook $VERSION" \
            --generate-notes

[package]
name = "nsh-app-podnook"
version = "0.3.0"
edition = "2024"
publish = false

[workspace]
members = ["core"]

# NSH 的 debug 构建默认带完整调试信息，target/ 会到 5 GB 以上。
# 这个项目不需要调试信息，关掉以控制体积。
[profile.dev]
debug = 0

[dependencies]
nsh-core = "=0.5.0"
nsh-base = "=0.5.0"
env_logger = "0.11"
podnook-core = { path = "core" }
log = "0.4.35"
base64 = "0.22"
jiff = "0.2.42"
objc2-core-graphics = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc"] }
objc2-service-management = "0.3.2"
serde_json = "1.0.154"
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
